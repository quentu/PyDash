[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydash"
version = "0.1.0"
description = "CLI infrastructure monitoring dashboard"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "rich>=13.7,<16",
    "requests>=2.31,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
pydash = "dashboard.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard", "dashboard.*"]
exclude = ["agent", "agent.*"]

[tool.setuptools.package-data]
dashboard = ["config/*.yaml"]